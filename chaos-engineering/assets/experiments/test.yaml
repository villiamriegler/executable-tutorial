apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: resilience-test
spec:
  entry: entry
  templates:
    # Run the two experiments one after the other.
    - name: entry
      templateType: Serial
      children:
        - pod-dies
        - network-partition

    # Experiment 1: kill a backend pod; the product page must keep answering 200.
    # The check starts first; the pod is killed 3 seconds in, so the check sees the gap.
    - name: pod-dies
      templateType: Parallel
      children:
        - products-keep-working
        - kill-backend-pod-after-3s
    - name: products-keep-working
      templateType: StatusCheck
      deadline: 13s
      abortWithStatusCheck: true
      statusCheck:
        mode: Continuous
        type: HTTP
        duration: 10s
        intervalSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 3
        successThreshold: 1
        http:
          url: http://frontend.default.svc:8080/
          method: GET
          criteria:
            statusCode: "200"
    - name: kill-backend-pod-after-3s
      templateType: Serial
      children:
        - wait-3s
        - kill-backend-pod
    - name: wait-3s
      templateType: Suspend
      deadline: 3s
    - name: kill-backend-pod
      templateType: PodChaos
      deadline: 5s
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces:
            - default
          labelSelectors:
            app: backend

    # Experiment 2: cut the network to the backend; /health must keep answering 200
    # and the product page must answer 502 within a second instead of hanging.
    # The network is cut first; the checks start 3 seconds in, once the cut is in effect.
    - name: network-partition
      templateType: Parallel
      children:
        - cut-network
        - health-keeps-working-after-3s
        - products-fail-fast-after-3s
    - name: cut-network
      templateType: NetworkChaos
      deadline: 20s
      networkChaos:
        action: partition
        mode: all
        selector:
          namespaces:
            - default
          labelSelectors:
            app: frontend
        direction: to
        target:
          mode: all
          selector:
            namespaces:
              - default
            labelSelectors:
              app: backend
    - name: health-keeps-working-after-3s
      templateType: Serial
      children:
        - wait-3s
        - health-keeps-working
    - name: health-keeps-working
      templateType: StatusCheck
      deadline: 15s
      abortWithStatusCheck: true
      statusCheck:
        mode: Continuous
        type: HTTP
        duration: 12s
        intervalSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 3
        successThreshold: 1
        http:
          url: http://frontend.default.svc:8080/health
          method: GET
          criteria:
            statusCode: "200"
    - name: products-fail-fast-after-3s
      templateType: Serial
      children:
        - wait-3s
        - products-fail-fast
    - name: products-fail-fast
      templateType: StatusCheck
      deadline: 15s
      abortWithStatusCheck: true
      statusCheck:
        mode: Continuous
        type: HTTP
        duration: 12s
        intervalSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 3
        successThreshold: 1
        http:
          url: http://frontend.default.svc:8080/
          method: GET
          criteria:
            statusCode: "502"
