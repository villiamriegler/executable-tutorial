<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Requests fail for about 1.6 seconds after the pod is deleted, until the new pod listens">
