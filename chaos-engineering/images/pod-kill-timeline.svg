  <text x="344" y="210" text-anchor="middle" font-size="12" fill="#607d8b">4 s</text>
  <line x1="456" y1="186" x2="456" y2="194" stroke="#455a64"/>
  <text x="456" y="210" text-anchor="middle" font-size="12" fill="#607d8b">6 s</text>
  <line x1="568" y1="186" x2="568" y2="194" stroke="#455a64"/>
