<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Requests succeed, fail while no backend pod is listening, then succeed again">
