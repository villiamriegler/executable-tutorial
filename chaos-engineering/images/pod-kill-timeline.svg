  <rect x="568.0" y="125" width="112.0" height="30" rx="0" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5" opacity="1.0"/>
  <rect x="568.0" y="125" width="5" height="30" fill="#ef6c00"/>
  <text x="624.0" y="145" text-anchor="middle" font-size="12" fill="#263238">pod B running</text>
