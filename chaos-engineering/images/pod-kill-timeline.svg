  <text x="204.0" y="80" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">200</text>
  <rect x="288.0" y="60" width="280.0" height="30" rx="0" fill="#fbd0cc" stroke="#d32f2f" stroke-width="1.5" opacity="1.0"/>
  <text x="428.0" y="80" text-anchor="middle" font-size="12" fill="#d32f2f" font-weight="bold">502</text>
  <rect x="568.0" y="60" width="112.0" height="30" rx="0" fill="#cfe8d0" stroke="#2e7d32" stroke-width="1.5" opacity="1.0"/>
  <text x="624.0" y="80" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">200</text>
  <rect x="120" y="125" width="168.0" height="30" rx="0" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5" opacity="1.0"/>
